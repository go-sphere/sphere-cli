name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Check dependencies
        run: make tidy-check
      # The CLI is the deliverable: compile the binary before running tests.
      - name: Build
        run: make build
      - name: Test
        run: make test
